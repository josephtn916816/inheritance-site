<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料更新原則｜傳承智策</title><link rel="stylesheet" href="../assets/site.css"></head><body><header class="site-header"><a class="brand" href="../"><span class="brand-mark">傳</span><span>傳承智策</span></a><nav><a href="../">返回首頁</a></nav></header><main><section class="section"><p class="eyebrow">VERIFIED DATA UPDATES</p><h1>資料更新原則</h1><p>法規與稅務資料更新包不同於程式安裝檔。系統只接受通過版本、雜湊及數位簽章驗證的資料包。</p><div class="grid three"><article><span>1</span><h3>專業覆核</h3><p>先確認資料來源、適用日期與內容，再由發行者核定。</p></article><article><span>2</span><h3>簽章封裝</h3><p>每份資料包均受簽章保護；不包含客戶資料、程式碼或私鑰。</p></article><article><span>3</span><h3>安全套用</h3><p>客戶端先驗證完整性與最低版本，通過後才可套用。</p></article></div><p class="note">目前尚未發布正式資料更新包。涉及申報與移轉的數字，仍須以主管機關與專業人士最新意見為準。</p></section></main><footer><span>© 2026 傳承智策</span><span><a href="../privacy/">隱私權政策</a></span></footer></body></html>
